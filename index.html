<style id="schedule-participant-clean-ui">
/* 참여 인원 선택 UI: 3열 카드형으로 단순/정렬 */
.participant-picker.open{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;padding:4px!important;max-height:420px!important;overflow-y:auto!important;overflow-x:hidden!important;background:transparent!important;border:0!important}
.participant-row{box-sizing:border-box!important;display:flex!important;align-items:center!important;gap:16px!important;min-height:62px!important;padding:0 18px!important;border:1px solid #263342!important;border-radius:12px!important;background:#0d141d!important;cursor:pointer!important}
.participant-row:hover{background:#131d28!important;border-color:#3b4d61!important}
.participant-row input{appearance:none!important;-webkit-appearance:none!important;width:28px!important;height:28px!important;min-width:28px!important;margin:0!important;border:2px solid #b9c0c8!important;border-radius:2px!important;background:#fff!important;accent-color:#6e9fe0!important;cursor:pointer!important}
.participant-row input:checked{background:#6e9fe0!important;border-color:#6e9fe0!important;box-shadow:inset 0 0 0 6px #fff!important}
.participant-row:has(input:checked){background:#14263a!important;border-color:#4e7ca8!important;box-shadow:inset 0 0 0 1px #315a7e!important}
.participant-row span{font-size:16px!important;font-weight:800!important;color:#e6ebf2!important;line-height:1.2!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.picker-title{font-size:14px!important;font-weight:800!important;color:#b8c4d3!important}
.selected-summary{min-height:42px!important;font-size:13px!important}
@media(max-width:900px){.participant-picker.open{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:560px){.participant-picker.open{grid-template-columns:1fr!important}.participant-row{min-height:56px!important}}
</style>
</head>

async function loginDdu(){
  if(!cloudConfigured)return setLoginError('서버 설정이 완료되지 않았습니다.');
  const nick=document.getElementById('loginNick').value.trim(),pw=document.getElementById('loginPw').value;
  if(!nick)return setLoginError('닉네임을 입력해주세요.');

  const btn=document.getElementById('loginSubmit');
  btn.disabled=true;
  setLoginError('접속 정보 확인 중...');
  try{
    /*
      중요: Supabase RLS가 적용된 환경에서는 로그인 전 익명 상태로
      clan_members를 조회하면 빈 결과가 올 수 있습니다.
      따라서 먼저 익명 인증 세션을 확보한 뒤 최신 혈맹원 정보를 조회합니다.
    */
    let {data:{session},error:sessionError}=await cloudClient.auth.getSession();
    if(sessionError)throw sessionError;
    if(!session){
      const r=await cloudClient.auth.signInAnonymously();
      if(r.error)throw r.error;
      session=r.data.session;
    }
    cloudUser=session.user;

    const {data:memberRows,error:memberError}=await cloudClient
      .from('clan_members')
      .select('*')
      .eq('clan_id',CLOUD_CLAN_ID);
    if(memberError)throw memberError;

    const loginMemberRaw=(memberRows||[]).find(x=>String(x.nickname||'').trim()===nick);
    if(!loginMemberRaw)return setLoginError('등록된 혈맹원 닉네임과 일치하지 않습니다.');

    const role=String(loginMemberRaw.role||'일반').trim();
    const requiredPassword=(nick==='베키')?'5621':(['군주','관리자','수호'].includes(role)?'12161216':'1216');
    if(pw!==requiredPassword)return setLoginError('비밀번호가 올바르지 않습니다.');

    await cloudLoad();
    if(!members.some(m=>String(m[0]||'').trim()===nick)){
      throw new Error('등록된 혈맹원 닉네임과 일치하지 않습니다.');
    }

    localStorage.setItem(LOGIN_KEY,JSON.stringify({nickname:nick,at:Date.now()}));
    localStorage.setItem('clanNick',nick);
    currentNick=nick;
    cloudReady=true;

    try{
      refreshOwnerControls();
      const ownerBtn=document.getElementById('ownerClaimBtn');if(ownerBtn)ownerBtn.style.display=cloudOwnerId?'none':'inline-grid';
      const adminBtn=document.getElementById('adminBtn');if(adminBtn)adminBtn.style.display=(String(currentNick||'')==='베키')?'inline-block':'none';
      const logoutBtn=document.getElementById('logoutBtn');if(logoutBtn)logoutBtn.style.display='inline-grid';
    }catch(uiSetupErr){console.error('UI setup error after login:',uiSetupErr);}

    showApp();
    try{cloudSubscribe();}catch(subErr){console.error('Realtime subscribe error:',subErr);}
    try{renderAll();}catch(renderErr){console.error('Initial render error after login:',renderErr);}
    setLoginError('');
    document.getElementById('loginPw').value='';
  }catch(e){
    console.error('Login error:',e);
    setLoginError(e?.message||'로그인에 실패했습니다.');
  }finally{
    btn.disabled=false;
  }
}

async function cloudInit(){
  if(!cloudConfigured){setLoginError('Supabase 설정이 필요합니다.');return;}

async function cloudLoad(){
  const [c,m,n,s,k]=await Promise.all([
    cloudClient.from('clans').select('*').eq('id',CLOUD_CLAN_ID).single(),
    cloudClient.from('clan_members').select('*').eq('clan_id',CLOUD_CLAN_ID),
    cloudClient.from('clan_notices').select('*').eq('clan_id',CLOUD_CLAN_ID).order('created_at',{ascending:false}),
    cloudClient.from('clan_schedules').select('*').eq('clan_id',CLOUD_CLAN_ID).order('event_date',{ascending:true}).order('start_hour',{ascending:true}),
    cloudClient.from('clan_categories').select('*').eq('clan_id',CLOUD_CLAN_ID).order('order_value',{ascending:true})
  ]);
  for(const r of [c,m,n,s,k])if(r.error)return cloudErr(r.error);
  cloudOwnerId=c.data.owner_user_id;
  clanMessage=c.data.message||'뚠뚠팀 혈맹 운영 페이지';
  currentServer=c.data.current_server||'바츠 03';
  members=m.data.map(x=>[x.nickname,x.level,x.weapon,x.role,x.id,x.notes,x.user_id]);
  notices=n.data.map(x=>({id:x.id,title:x.title,date:new Date(x.created_at).toISOString().slice(0,10).replaceAll('-','.'),body:x.body,image:x.image_url,tag:x.tag,author:x.author_nickname,created_at:x.created_at,updated_at:x.updated_at}));
  schedules=s.data.map(x=>({id:x.id,date:x.event_date,start:x.start_hour,end:x.end_hour,title:x.title,count:x.count_text}));
  const savedMenuAccess=JSON.parse(localStorage.getItem("clanMenuAccess")||"{}");
  categories=k.data.map(x=>{const def=defaultCategories.find(d=>d.id===x.category_key)||{};return {id:x.category_key,label:x.label,order:x.order_value,fixed:x.fixed,visible:def.visible!==false,allowedRoles:savedMenuAccess[x.category_key]||["군주","관리자","수호","일반"]};});
  // DB에 아직 저장되지 않은 신규 기본 메뉴도 상단 메뉴에 항상 추가
  defaultCategories.filter(def=>!categories.some(c=>c.id===def.id)).forEach(def=>{
    categories.push({...def,allowedRoles:savedMenuAccess[def.id]||["군주","관리자","수호","일반"]});
  });
  // 신규 메뉴의 순서가 기존 메뉴와 겹치지 않도록 정렬 기준을 보정
  categories.filter(c=>!c.fixed).sort((a,b)=>a.order-b.order||a.label.localeCompare(b.label,'ko')).forEach((c,i)=>c.order=i+1);
  const saved=JSON.parse(localStorage.getItem(LOGIN_KEY)||'null');
  const savedMember=saved?.nickname?members.find(x=>x[0]===saved.nickname):null;
  const mine=members.find(x=>x[6]===cloudUser.id);
  currentNick=savedMember?savedMember[0]:(mine?mine[0]:'설정 필요');
}
function cloudSubscribe(){
  cloudClient.channel('ddunteam-live').on('postgres_changes',{event:'*',schema:'public',table:'clans',filter:'id=eq.ddunteam'},()=>cloudRefresh()).on('postgres_changes',{event:'*',schema:'public',table:'clan_members',filter:'clan_id=eq.ddunteam'},()=>cloudRefresh()).on('postgres_changes',{event:'*',schema:'public',table:'clan_notices',filter:'clan_id=eq.ddunteam'},()=>cloudRefresh()).on('postgres_changes',{event:'*',schema:'public',table:'clan_schedules',filter:'clan_id=eq.ddunteam'},()=>cloudRefresh()).on('postgres_changes',{event:'*',schema:'public',table:'clan_categories',filter:'clan_id=eq.ddunteam'},()=>cloudRefresh()).subscribe();
}

async function saveNotice(i){

  const t=document.getElementById('ntitle').value.trim(),b=document.getElementById('nbody').value.trim(),tag=document.getElementById('ntag').value;
  if(!t||!b)return toast('제목과 내용을 입력해주세요.');
  let imageUrl=pendingImage||'';
  if(imageUrl.startsWith('data:')){
    const f=await fetch(imageUrl).then(r=>r.blob());
    const ext=(f.type.split('/')[1]||'png').replace('jpeg','jpg');
    const path=CLOUD_CLAN_ID+'/'+crypto.randomUUID()+'.'+ext;
    const up=await cloudClient.storage.from('notice-images').upload(path,f,{contentType:f.type,upsert:false});
    if(up.error)return cloudErr(up.error);
    imageUrl=cloudClient.storage.from('notice-images').getPublicUrl(path).data.publicUrl;
  }
  const payload={clan_id:CLOUD_CLAN_ID,title:t,body:b,image_url:imageUrl,tag,author_nickname:currentNick};
  const q=i===null?cloudClient.from('clan_notices').insert(payload):cloudClient.from('clan_notices').update(payload).eq('id',notices[i].id);
  const {error}=await q;if(error)return cloudErr(error);
  pendingImage='';await cloudRefresh();closeModal();toast(i===null?'공지사항을 등록했습니다.':'공지사항을 수정했습니다.');
}
async function deleteNotice(i){
  if(!canManage())return toast('공지 삭제는 페이지 소유자/군주/수호만 가능합니다.');
  if(!confirm('이 공지사항을 삭제할까요?'))return;
  const {error}=await cloudClient.from('clan_notices').delete().eq('id',notices[i].id);if(error)return cloudErr(error);await cloudRefresh();toast('공지사항을 삭제했습니다.');
}

async function saveSchedule(id){if(!canManage())return toast('일정 관리는 페이지 소유자/군주/수호만 가능합니다.');const date=document.getElementById('sd').value,start=+document.getElementById('ss').value,end=+document.getElementById('se').value,title=document.getElementById('st').value.trim(),participants=[...document.querySelectorAll('#participantPicker input:checked')].map(x=>x.value);if(!date||!title||end<=start||start<0||end>24)return toast('날짜/시간/내용을 확인해주세요.');const payload={clan_id:CLOUD_CLAN_ID,event_date:date,start_hour:start,end_hour:end,title,count_text:schedulePayloadCount(participants),created_by_nickname:currentNick};const q=id===null?cloudClient.from('clan_schedules').insert(payload):cloudClient.from('clan_schedules').update(payload).eq('id',id);const {error}=await q;if(error)return cloudErr(error);await cloudRefresh();closeModal();toast('일정을 저장했습니다.')}

async function deleteSchedule(id){if(!canManage())return toast('일정 관리는 페이지 소유자/군주/수호만 가능합니다.');const {error}=await cloudClient.from('clan_schedules').delete().eq('id',id);if(error)return cloudErr(error);await cloudRefresh();openSchedule();toast('일정을 삭제했습니다.');}

async function saveServer(){if(!canManage())return toast('서버 변경은 페이지 소유자/군주/수호만 가능합니다.');const v=document.getElementById('serverSelect').value;const {error}=await cloudClient.from('clans').update({current_server:v,updated_at:new Date().toISOString()}).eq('id',CLOUD_CLAN_ID);if(error)return cloudErr(error);currentServer=v;await cloudRefresh();closeModal();toast('현재 서버를 '+v+'로 변경했습니다.');}
async function saveClanMessage(){if(!canManage())return toast('혈맹 남긴말 수정은 페이지 소유자/군주/수호만 가능합니다.');const v=document.getElementById('clanMessageInput').value.trim();if(!v)return toast('남긴말을 입력해주세요.');const {error}=await cloudClient.from('clans').update({message:v,updated_at:new Date().toISOString()}).eq('id',CLOUD_CLAN_ID);if(error)return cloudErr(error);clanMessage=v;const e=document.getElementById('clanMessage');if(e)e.textContent=v;closeModal();toast('혈맹 남긴말을 저장했습니다.');}

async function saveCategoryOrder(){
  if(!canManage())return toast('권한이 없습니다.');
  const values=categories.filter(c=>!c.fixed).map(c=>({id:c.id,value:+document.getElementById('order-'+c.id).value}));
  if(values.some(x=>!Number.isInteger(x.value)||x.value<1))return toast('order는 1 이상의 정수로 입력해주세요.');
  values.sort((a,b)=>a.value-b.value).forEach((x,i)=>{const c=categories.find(c=>c.id===x.id);c.order=i+1;});
  for(const c of categories.filter(x=>!x.fixed)){const {error}=await cloudClient.from('clan_categories').update({order_value:c.order}).eq('clan_id',CLOUD_CLAN_ID).eq('category_key',c.id);if(error)return cloudErr(error)}
  await cloudRefresh();closeModal();showPage('main',document.querySelector('#tabs button'));toast('카테고리 순서를 저장했습니다.');
}

async function claimOwner(){
  const code=prompt('페이지 소유자 등록 코드를 입력하세요.');if(!code)return;
  const {error}=await cloudClient.rpc('claim_owner',{p_clan_id:CLOUD_CLAN_ID,p_owner_code:code});if(error)return cloudErr(error);
  await cloudRefresh();toast('페이지 소유자로 등록했습니다.');
}

// Keep the current UI's initial render, but load the shared backend first.
document.addEventListener('DOMContentLoaded',()=>{const img=document.querySelector('.brand img'),loginLogo=document.getElementById('loginLogo');if(img&&loginLogo)loginLogo.src=img.src;const b=document.createElement('button');b.id='ownerClaimBtn';b.className='pencil';b.textContent='소유자 등록';b.style.display='none';b.onclick=claimOwner;const c=document.querySelector('.current-row');if(c)c.appendChild(b);const lo=document.createElement('button');lo.id='logoutBtn';lo.className='pencil';lo.textContent='↪';lo.title='로그아웃';lo.style.display='none';lo.onclick=logoutDdu;if(c)c.appendChild(lo);cloudInit();});

</script>
<script>
/* v35 comprehensive feature layer */
(function(){
  const LS={
    memberInfo:'ddunteam.memberInfo.v35',
    letters:'ddunteam.letters.v35',
    memo:'ddunteam.memo.v35',
    inventory:'ddunteam.inventory.v35',
    items:'ddunteam.items.v35',
    categories:'ddunteam.categories.v35'
  };
  const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
  const store=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  // Preserve letters created in previous versions when upgrading to v35.
  (function migrateLetters(){
    const current=load(LS.letters,null);
    if(Array.isArray(current)&&current.length)return;
    for(const oldKey of ['ddunteam.letters.v34.1','ddunteam.letters.v34','ddunteam.letters.v33','clanLetters','letters']){
      const old=load(oldKey,null);
      if(Array.isArray(old)&&old.length){store(LS.letters,old);break;}
    }
  })();
  window._v35={LS,load,store};

  /* Keep menu visibility/order locally even if the old cloud table has no visible column. */
  const oldCloudLoad=window.cloudLoad;
  if(typeof oldCloudLoad==='function'){
    window.cloudLoad=async function(){
      await oldCloudLoad();
      const saved=load(LS.categories,null);
      if(Array.isArray(saved)){
        categories=categories.map(c=>{const s=saved.find(x=>x.id===c.id);return s?{...c,order:s.order,visible:c.fixed?true:s.visible!==false}:{...c};});
      }
      categories=categories.filter(c=>c.id!=='calendar'&&c.id!=='schedule');
    };
  }

  /* Permission hierarchy: owner > lord > admin > guard > normal. */
  window.rankOf=function(n){if(n==='베키')return '페이지 소유자';const m=members.find(x=>x[0]===n);return m?m[3]:''};
  window.canManage=function(){return !!window.cloudUser && (window.isPageOwner?.() || ['군주','관리자','수호'].includes(rankOf(currentNick)))};
  window.canClanManage=function(){return !!window.cloudUser && (window.isPageOwner?.() || ['군주','관리자'].includes(rankOf(currentNick)))};
  window.canSiteEdit=function(){return !!window.cloudUser && isPageOwner()};

  /* Category manager with output flag. */
  window.openCategoryOrder=function(){
    if(!canSiteEdit())return toast('사이트 수정은 페이지 소유자만 가능합니다.');
    const ordered=categories.filter(c=>!c.fixed&&c.id!=='calendar'&&c.id!=='schedule').sort((a,b)=>a.order-b.order);
    openModal(`<div class="modal-head"><div><h3>카테고리 순서 관리</h3><div class="banner-sub">메인은 고정됩니다. 출력 여부로 상단 메뉴를 숨길 수 있습니다.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="order-list"><div class="order-row"><div class="order-name">⌂ 메인 <span class="order-fixed">고정</span></div><div>TRUE</div><div>항상 1순위</div></div>${ordered.map(c=>`<div class="order-row"><div class="order-name">${escapeHtml(c.label)}</div><div><label class="toggle-line"><input class="category-visible" id="visible-${c.id}" type="checkbox" ${c.visible!==false?'checked':''}><span>출력</span></label></div><div><input class="order-input" id="order-${c.id}" type="number" min="1" value="${c.order}"></div></div>`).join('')}</div><div class="modal-actions"><button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategoryOrder()">저장</button></div>`);
  };
  window.saveCategoryOrder=function(){
    if(!canSiteEdit())return toast('권한이 없습니다.');
    const vals=categories.filter(c=>!c.fixed&&c.id!=='calendar'&&c.id!=='schedule').map(c=>({id:c.id,order:+document.getElementById('order-'+c.id).value,visible:document.getElementById('visible-'+c.id).checked}));
    if(vals.some(x=>!Number.isInteger(x.order)||x.order<1))return toast('순서는 1 이상의 정수로 입력해주세요.');
    vals.sort((a,b)=>a.order-b.order).forEach((x,i)=>{const c=categories.find(c=>c.id===x.id);c.order=i+1;c.visible=x.visible;});
    store(LS.categories,categories);renderTabs('main');closeModal();toast('카테고리 순서와 출력 여부를 저장했습니다.');
  };

  /* Schedule: robust participant payload + monthly planning + sticky weekly header. */
  window.scheduleParticipants=function(s){if(Array.isArray(s?.participants))return s.participants;try{const x=JSON.parse(s?.count||'');if(Array.isArray(x?.participants))return x.participants}catch(e){}return []};
  window.scheduleCountLabel=function(s){const p=scheduleParticipants(s);return p.length?p.length+'명 참여':(s?.count||'')};
  window.schedulePayloadCount=function(p){return JSON.stringify({participants:p||[]})};
  window.openSchedule=async function(){
    if(!canManage())return toast('일정 관리는 페이지 소유자/군주/관리자/수호만 가능합니다.');
    if(typeof cloudReady!=='undefined'&&cloudReady){try{await cloudLoad()}catch(e){cloudErr(e)}}
    const now=new Date(),sun=new Date(now);sun.setDate(now.getDate()-now.getDay());const days=Array.from({length:7},(_,i)=>{const d=new Date(sun);d.setDate(sun.getDate()+i);return d});
    let h=`<div class="modal-head"><div><h3>전체 일정 · 주간 관리</h3><div class="admin-sub">1시간 단위로 일정을 관리합니다.</div></div><div class="head-actions"><button onclick="openMonthSchedule()">월간 일정 관리</button><button class="close" onclick="closeModal()">×</button></div></div><div class="schedule-wrap"><div class="schedule"><div class="cell head">시간</div>${days.map(d=>`<div class="cell head sticky-col">${['일','월','화','수','목','금','토'][d.getDay()]}<br>${d.getDate()}</div>`).join('')}`;
    for(let hour=0;hour<24;hour++){
      h+=`<div class="cell time">${String(hour).padStart(2,'0')}:00</div>`;
      for(const d of days){const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),its=schedules.filter(s=>s.date===ds&&s.start===hour);h+=`<div class="cell" onclick="if(!event.target.closest('.slot'))openScheduleEditor(null,'${ds}',${hour})">${its.map(s=>`<div class="slot" onclick="event.stopPropagation();openScheduleEditor(${s.id})">${escapeHtml(s.title)}<br>${String(s.start).padStart(2,'0')}:00-${String(s.end).padStart(2,'0')}:00</div>`).join('')}</div>`}
    }
    h+='</div></div>';openModal(h,'wide');
  };
  window.openMonthSchedule=async function(y=new Date().getFullYear(),m=new Date().getMonth()){
    if(typeof cloudReady!=='undefined'&&cloudReady){try{await cloudLoad()}catch(e){cloudErr(e)}}
    const first=new Date(y,m,1),last=new Date(y,m+1,0),prev=first.getDay();let cells='';
    for(let i=0;i<prev;i++)cells+='<div class="month-cell muted"></div>';
    for(let d=1;d<=last.getDate();d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),its=schedules.filter(s=>s.date===ds).sort((a,b)=>a.start-b.start);cells+=`<div class="month-cell ${(ds===todayStr()?'today ':'')+(new Date(y,m,d).getDay()===0||new Date(y,m,d).getDay()===6?'holiday':'')}" onclick="if(!event.target.closest('.month-event'))openScheduleEditor(null,'${ds}',21)"><b>${d}</b>${its.map(s=>`<div class="month-event" onclick="event.stopPropagation();openScheduleEditor(${s.id})">${String(s.start).padStart(2,'0')}:00 ${escapeHtml(s.title)}</div>`).join('')}</div>`}
    openModal(`<div class="modal-head"><div><h3>월간 일정 관리</h3><div class="cal-nav"><button onclick="openMonthSchedule(${m===0?y-1:y},${m===0?11:m-1})">‹</button><strong>${y}. ${String(m+1).padStart(2,'0')}</strong><button onclick="openMonthSchedule(${m===11?y+1:y},${m===11?0:m+1})">›</button><button onclick="openMonthSchedule(new Date().getFullYear(),new Date().getMonth())">오늘</button></div></div><div class="head-actions"><button onclick="openSchedule()">주간 관리</button><button class="close" onclick="closeModal()">×</button></div></div><div class="big-cal-head">${['일','월','화','수','목','금','토'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="month-calendar">${cells}</div>`,'calendar-wide');
  };
  window.openScheduleEditor=function(id,date,hour){
    if(!canManage())return toast('일정 관리는 운영진만 가능합니다.');
    const s=id===null?{id:null,date:date||todayStr(),start:hour??21,end:(hour??21)+1,title:'',participants:[]}:schedules.find(x=>x.id===id);if(!s)return toast('일정을 찾을 수 없습니다.');
    const p=scheduleParticipants(s);
    openModal(`<div class="modal-head"><h3>${id===null?'일정 추가':'일정 수정'}</h3><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>날짜<input id="sd" type="date" value="${s.date}"></label><div class="row"><label>시작 시간<input id="ss" type="number" min="0" max="23" value="${s.start}"></label><label>종료 시간<input id="se" type="number" min="1" max="24" value="${s.end}"></label></div><div class="picker-section"><div class="picker-title">참여 인원</div><div id="participantSummary" class="selected-summary" onclick="toggleParticipantPicker()">${p.length?p.map(n=>`<span class="chip">${escapeHtml(n)}</span>`).join(''):'참여 인원을 선택해주세요'}</div><div id="participantPicker" class="participant-picker">${members.map(m=>`<label class="participant-row"><input type="checkbox" value="${escapeHtml(m[0])}" ${p.includes(m[0])?'checked':''} onchange="updateParticipantSummary()"><span>${escapeHtml(m[0])}</span></label>`).join('')}</div></div><label>일정 내용<input id="st" value="${escapeHtml(s.title)}"></label></div><div class="modal-actions">${id!==null?`<button class="danger" onclick="deleteSchedule(${id})">삭제</button>`:''}<button onclick="closeModal()">취소</button><button class="primary" onclick="saveSchedule(${id===null?'null':id})">저장</button></div>`,'small');
  };
  window.saveSchedule=async function(id){
    if(!canManage())return toast('일정 관리 권한이 없습니다.');const date=document.getElementById('sd').value,start=+document.getElementById('ss').value,end=+document.getElementById('se').value,title=document.getElementById('st').value.trim(),participants=[...document.querySelectorAll('#participantPicker input:checked')].map(x=>x.value);if(!date||!title||end<=start||start<0||end>24)return toast('날짜/시간/내용을 확인해주세요.');
    if(typeof cloudReady!=='undefined'&&cloudReady){const payload={clan_id:CLOUD_CLAN_ID,event_date:date,start_hour:start,end_hour:end,title,count_text:schedulePayloadCount(participants),created_by_nickname:currentNick};const q=id===null?cloudClient.from('clan_schedules').insert(payload):cloudClient.from('clan_schedules').update(payload).eq('id',id);const {error}=await q;if(error)return cloudErr(error);await cloudRefresh();closeModal();toast('일정을 저장했습니다.');return;}
    const item={id:id===null?Date.now():id,date,start,end,title,count:schedulePayloadCount(participants)};if(id===null)schedules.push(item);else schedules[schedules.findIndex(x=>x.id===id)]=item;save();renderAll();closeModal();toast('일정을 저장했습니다.');
  };
  window.deleteSchedule=async function(id){if(!canManage())return toast('일정 관리 권한이 없습니다.');if(typeof cloudReady!=='undefined'&&cloudReady){const {error}=await cloudClient.from('clan_schedules').delete().eq('id',id);if(error)return cloudErr(error);await cloudRefresh();openSchedule();return;}schedules=schedules.filter(s=>s.id!==id);save();renderAll();openSchedule();};
  window.openCalendarDetail=async function(y=new Date().getFullYear(),m=new Date().getMonth()){if(typeof cloudReady!=='undefined'&&cloudReady){try{await cloudLoad()}catch(e){cloudErr(e)}}renderCalendarDetail(y,m)};
  window.renderCalendar=function(){const el=document.getElementById('calendar');if(!el)return;const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);el.innerHTML='';for(let i=0;i<first.getDay();i++)el.innerHTML+='<div class="day muted"></div>';for(let d=1;d<=last.getDate();d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),date=new Date(y,m,d),its=schedules.filter(s=>s.date===ds).sort((a,b)=>a.start-b.start);el.innerHTML+=`<div class="day ${dayClass(ds,date)}" onclick="${canManage()?'openScheduleEditor(null,\''+ds+'\',21)':''}"><div>${d}</div>${koreanHolidays[ds]?`<div class="holiday-name">${koreanHolidays[ds]}</div>`:''}${its.slice(0,2).map(s=>`<div class="mini-cal-event" onclick="event.stopPropagation();openScheduleEditor(${s.id})">${String(s.start).padStart(2,'0')}:00 ${escapeHtml(s.title)}</div>`).join('')}</div>`}};

  /* Mini games: local, lightweight entertainment tools. */
  let miniGameState={game:null,players:[],result:null};
  function miniEligibleMembers(){return members.filter(m=>String(m[1])!=='100').sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'ko'));}
  function renderMiniGamesPage(){
    const extra=document.getElementById('extraPage'); if(!extra)return;
    if(!miniGameState.game){
      extra.innerHTML=`<div class="card data-page mini-games"><div class="head"><div><div class="title">🎮 미니 게임</div><div class="admin-sub">혈맹원들과 가볍게 즐길 수 있는 랜덤 게임과 시뮬레이션입니다.</div></div></div><div class="mini-game-grid">
        <button class="mini-game-card" onclick="openMiniGame('pinball')"><span>🎱</span><b>핀볼</b><small>여러 명의 이름을 넣고 랜덤 결과를 뽑아요.</small></button>
        <button class="mini-game-card" onclick="openMiniGame('race')"><span>🏎️</span><b>경주</b><small>최대 6명이 달려서 순위를 정해요.</small></button>
        <button class="mini-game-card" onclick="openMiniGame('ladder')"><span>🪜</span><b>사다리타기</b><small>참여자와 결과를 랜덤으로 연결해요.</small></button>
        <button class="mini-game-card" onclick="openMiniGame('sim')"><span>🎰</span><b>시뮬레이션</b><small>강화·뽑기·주사위 같은 확률 게임을 즐겨요.</small></button>
      </div></div>`; return;
    }
    const game=miniGameState.game;
    if(game==='sim'){renderSimulationHub();return;}
    const max=game==='race'?6:12;
    const preset=miniGameState.players;
    extra.innerHTML=`<div class="card data-page mini-games"><div class="head"><div><div class="title">${game==='pinball'?'🎱 핀볼':game==='race'?'🏎️ 경주':'🪜 사다리타기'}</div><div class="admin-sub">참여자를 선택한 뒤 게임을 시작하세요. ${game==='race'?'최대 6명':''}</div></div><button class="ghost" onclick="backToMiniGames()">← 게임 선택</button></div>
      <div class="mini-toolbar"><button class="ghost" onclick="selectAllMiniPlayers(${max})">혈맹원에서 자동 선택</button><button class="ghost" onclick="clearMiniPlayers()">초기화</button><span class="mini-count">${preset.length}/${max}명</span></div>
      <div class="mini-player-grid">${miniEligibleMembers().map(m=>{const checked=preset.includes(m[0]);return `<label class="mini-player"><input type="checkbox" value="${escapeHtml(m[0])}" ${checked?'checked':''} onchange="syncMiniPlayers(${max})"><span>${escapeHtml(m[0])}</span></label>`}).join('')}</div>
      <div class="mini-custom"><input id="miniCustomName" placeholder="직접 이름 추가"><button class="primary" onclick="addMiniCustom(${max})">추가</button></div>
      ${miniGameState.result?`<div class="mini-result">${miniGameState.result}</div>`:''}
      <div class="modal-actions"><button class="primary" onclick="startMiniGame()">게임 시작</button></div></div>`;
  }

  function runEnhance(){let lv=Math.max(0,+document.getElementById('enhLv').value||0),target=Math.max(lv+1,+document.getElementById('enhTarget').value||lv+1),rate=Math.min(100,Math.max(0.1,+document.getElementById('enhRate').value||50)),tries=0;while(lv<target&&tries<10000){tries++;if(Math.random()*100<rate)lv++;else break;}document.getElementById('simResult').innerHTML=`현재 단계 <b>+${lv}</b> / 목표 +${target}<br>${lv>=target?'🎉 목표 강화 성공!':'💥 강화 실패'}<br>시도 횟수: ${tries}`;}
  function runGacha(){const rate=Math.min(100,Math.max(0.01,+document.getElementById('gachaRate').value||1)),count=Math.min(100000,Math.max(1,+document.getElementById('gachaCount').value||100));let win=0;for(let i=0;i<count;i++)if(Math.random()*100<rate)win++;const pct=win/count*100;document.getElementById('simResult').innerHTML=`총 ${count.toLocaleString()}회<br>대박 획득 <b>${win}</b>회<br>실제 결과 확률 <b>${pct.toFixed(2)}%</b>`;}

<script>
(function(){
  function miniFxBox(title,status){
    return `<div class="mini-fx"><div class="mini-fx-head"><div class="mini-fx-title">${title}</div><div class="mini-fx-status">${status}</div></div><div id="miniFxStage"></div></div>`;
  }
  function esc(s){return typeof escapeHtml==='function'?escapeHtml(s):String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  async function animatePinball(results){
    const stage=document.getElementById('miniFxStage'); if(!stage)return;
    stage.innerHTML=results.map((x,i)=>`<div class="mini-pin-lane"><b style="position:absolute;left:10px;top:13px;z-index:2">${esc(x.n)}</b><div class="mini-ball" id="pb${i}">●</div></div>`).join('');
    const width=Math.max(240,stage.clientWidth-42);
    await Promise.all(results.map((x,i)=>new Promise(resolve=>{
      const el=document.getElementById('pb'+i);
      const wobble=60+Math.random()*90, finish=Math.max(35,width*(x.s/1000));
      let t0=performance.now(), dur=900+Math.random()*900;
      function frame(t){
        let p=Math.min(1,(t-t0)/dur), ease=1-Math.pow(1-p,3);
        let wob=Math.sin(p*18+i)*wobble*(1-p)*.035;
        el.style.transform=`translateX(${finish*ease+wob}px)`;
        if(p<1)requestAnimationFrame(frame);else resolve();
      }
      requestAnimationFrame(frame);
    })));
    document.querySelector('.mini-fx-status').textContent='결과 확정';
  }

  async function animateRace(results){
    const stage=document.getElementById('miniFxStage'); if(!stage)return;
    const best=Math.min(...results.map(x=>x.t)), max=Math.max(...results.map(x=>x.t));
    stage.innerHTML=results.map((x,i)=>`<div class="mini-race-lane"><b style="position:absolute;left:10px;top:14px;z-index:2">${esc(x.n)}</b><div class="mini-car" id="rc${i}">🏎️</div></div>`).join('');
    const width=Math.max(250,stage.clientWidth-55);
    await Promise.all(results.map((x,i)=>new Promise(resolve=>{
      const el=document.getElementById('rc'+i);
      const dur=1200+(x.t-best)*450;
      let t0=performance.now();
      function frame(t){
        let p=Math.min(1,(t-t0)/dur), ease=1-Math.pow(1-p,3);
        el.style.transform=`translateX(${width*ease}px)`;
        if(p<1)requestAnimationFrame(frame);else resolve();
      }
      requestAnimationFrame(frame);
    })));
    document.querySelector('.mini-fx-status').textContent='결승선 통과 · 순위 확정';
  }

  async function animateLadder(players, shuffled){
    const stage=document.getElementById('miniFxStage'); if(!stage)return;
    const n=players.length;
    const rungs=[];
    for(let i=0;i<n-1;i++) rungs.push({row:35+i*27,a:i,b:i+1});
    stage.innerHTML=`<div class="mini-ladder-wrap" style="--cols:${n}">${players.map((p,i)=>`<div class="mini-ladder-col" id="lc${i}"><b style="position:absolute;top:-25px;left:50%;transform:translateX(-50%);white-space:nowrap">${esc(p)}</b></div>`).join('')}${rungs.map(r=>`<div class="mini-rung" style="top:${r.row}px;left:calc(${(r.a+.5)*(100/n)}%);width:${100/n}px"></div>`).join('')}</div><div class="mini-reveal" id="ladderReveal">사다리를 내려가는 중…</div>`;
    const wrap=stage.querySelector('.mini-ladder-wrap');
    const dot=document.createElement('div');dot.className='mini-ladder-dot';wrap.appendChild(dot);
    for(let i=0;i<n;i++){
      const x=(i+.5)*100/n;
      dot.style.left=x+'%'; dot.style.top='0px';
      await new Promise(r=>setTimeout(r,220));
      dot.style.transition='top .22s ease,left .22s ease';
      dot.style.top='210px';
      await new Promise(r=>setTimeout(r,240));
      dot.style.top='0px'; dot.style.transition='none';
    }
    document.getElementById('ladderReveal').innerHTML='🎉 결과 확정 · '+players.map((p,i)=>`${esc(p)} → ${esc(shuffled[i])}`).join('　');
  }

  function renderMiniResult(title, rows){
    const box=document.getElementById('miniFxStage'); if(!box)return;
    box.innerHTML=`<div class="mini-reveal" style="text-align:left"><h4 style="margin:0 0 10px">${title}</h4>${rows.join('')}</div>`;
  }

  window.startMiniGame = async function(){
    const p=miniGameState.players;
    if(p.length<2)return toast('2명 이상 선택해주세요.');
    const game=miniGameState.game;
    const extra=document.getElementById('extraPage');
    let results, title;

    /* 현재는 브라우저에서 결과를 만들고 연출합니다.
       추후 서버 API가 결과를 반환하면 이 results 부분만 서버 응답으로 교체하면 됩니다.
       핵심은 "결과 계산"과 "클라이언트 연출"을 분리하는 구조입니다. */
    if(game==='pinball'){
      results=p.map(n=>({n,s:Math.floor(Math.random()*1001)})).sort((a,b)=>b.s-a.s);
      title='🎱 핀볼';
      extra.innerHTML=extra.innerHTML+miniFxBox(title,'공이 튀는 중…');
      await animatePinball(results);
      renderMiniResult('🏆 핀볼 결과',results.map((x,i)=>`<div class="mini-result-row"><b>${i+1}위</b><span>${esc(x.n)}</span><strong>${x.s}점</strong></div>`));
    }else if(game==='race'){
      results=p.map(n=>({n,t:Math.random()*4+1})).sort((a,b)=>a.t-b.t);
      title='🏎️ 경주';
      extra.innerHTML=extra.innerHTML+miniFxBox(title,'출발 준비…');
      await animateRace(results);
      renderMiniResult('🏁 경주 결과',results.map((x,i)=>`<div class="mini-result-row"><b>${i+1}위</b><span>🏎️ ${esc(x.n)}</span><strong>${x.t.toFixed(2)}초</strong></div>`));
    }else{
      const shuffled=[...p].sort(()=>Math.random()-.5);
      title='🪜 사다리타기';
      extra.innerHTML=extra.innerHTML+miniFxBox(title,'사다리 생성 중…');
      await animateLadder(p,shuffled);
      renderMiniResult('🪜 사다리 결과',p.map((n,i)=>`<div class="mini-result-row"><b>${esc(n)}</b><span>→</span><strong>${esc(shuffled[i])}</strong></div>`));
    }
    document.querySelectorAll('.mini-fx').forEach(x=>x.classList.add('mini-pulse'));
  };
})();
</script>


<script>
/* v36.6: 인라인 onclick 의존을 제거하고 미니게임 시작 버튼을 이벤트 위임으로 확실하게 연결 */
(function(){
  function bindMiniGameStart(){
    if(window.__v366MiniBound) return;
    window.__v366MiniBound=true;
    document.addEventListener('click', function(e){
      const btn=e.target.closest('#miniGameStartBtn');
      if(!btn) return;
      e.preventDefault();
      e.stopPropagation();
      if(typeof window.startMiniGame==='function'){
        Promise.resolve(window.startMiniGame()).catch(err=>{
          console.error('Mini game start error:',err);
          if(typeof window.toast==='function') window.toast('게임 실행 중 오류가 발생했습니다.');
        });
      }
    }, true);
  }

  const originalRender=window.renderMiniGamesPage;
  if(typeof originalRender==='function'){
    window.renderMiniGamesPage=function(){
      originalRender.apply(this,arguments);
      const buttons=document.querySelectorAll('button[onclick="startMiniGame()"]');
      buttons.forEach(b=>{
        b.removeAttribute('onclick');
        b.id='miniGameStartBtn';
      });
    };
  }
  bindMiniGameStart();

  /* 기존 함수가 다시 노출되거나 렌더 함수가 재정의되는 경우에도 버튼을 잡는다. */
  const obs=new MutationObserver(()=>{
    document.querySelectorAll('button[onclick="startMiniGame()"]').forEach(b=>{

  obs.observe(document.documentElement,{subtree:true,childList:true});

      setTimeout(()=>{const st=document.getElementById('v367Stage');if(st)st.insertAdjacentHTML('beforeend',`<div class="v367-result"><b>🏆 결과</b>${rows.map((r,i)=>`<div class="mini-result-row"><b>${i+1}위</b><span>${safe(r.n)}</span><strong>${r.s}점</strong></div>`).join('')}</div>`)},2200);
    }else if(game==='race'){
      rows=names.map(n=>({n,t:1+Math.random()*4})).sort((a,b)=>a.t-b.t);
      extra.innerHTML=`<div class="card data-page mini-games"><div class="head"><div><div class="title">🏎️ 경주</div><div class="admin-sub">출발부터 결승선까지 실제로 달립니다.</div></div></div><div class="v367-stage" id="v367Stage"><div style="text-align:center;margin-bottom:12px">🏁 <b>READY... GO!</b></div>${rows.map((r,i)=>`<div class="v367-lane"><span>${safe(r.n)}</span><div class="v367-car" id="v367c${i}">🏎️</div><div class="v367-finish"></div></div>`).join('')}</div></div>`;
      requestAnimationFrame(()=>rows.forEach((r,i)=>setTimeout(()=>{const e=document.getElementById('v367c'+i);if(e)e.style.left=(document.getElementById('v367Stage').clientWidth-70)+'px'},i*120)));
      setTimeout(()=>{const st=document.getElementById('v367Stage');if(st)st.insertAdjacentHTML('beforeend',`<div class="v367-result"><b>🏁 최종 순위</b>${rows.map((r,i)=>`<div class="mini-result-row"><b>${i+1}위</b><span>🏎️ ${safe(r.n)}</span><strong>${r.t.toFixed(2)}초</strong></div>`).join('')}</div>`)},2800);
    }else{
      const shuffled=[...names].sort(()=>Math.random()-.5);
      extra.innerHTML=`<div class="card data-page mini-games"><div class="head"><div><div class="title">🪜 사다리타기</div><div class="admin-sub">사다리를 타고 결과를 확인합니다.</div></div></div><div class="v367-stage"><div style="text-align:center;font-size:18px;margin-bottom:18px">🪜 사다리 진행 중...</div><div class="v367-result" id="v367ladder">결과를 추첨하고 있습니다<span class="mini-spin"> ⏳</span></div></div></div>`;
      setTimeout(()=>{const e=document.getElementById('v367ladder');if(e)e.innerHTML=`<b>🎉 결과 확정</b>${names.map((n,i)=>`<div class="mini-result-row"><b>${safe(n)}</b><span>→</span><strong>${safe(shuffled[i])}</strong></div>`).join('')}`},2200);
    }
  }

  function bind(){
    document.addEventListener('click',e=>{
      const b=e.target.closest('button[onclick="startMiniGame()"],#miniGameStartBtn');
      if(!b)return;
      e.preventDefault(); e.stopImmediatePropagation();

      const title=document.querySelector('.mini-games .title')?.textContent||'';

    const obs=new MutationObserver(()=>{
      document.querySelectorAll('button[onclick="startMiniGame()"]').forEach(b=>{

        const title=document.querySelector('.mini-games .title')?.textContent||'';
        b.setAttribute('data-mini-game',title.includes('경주')?'race':title.includes('사다리')?'ladder':'pinball');
      });
    });
    obs.observe(document.documentElement,{subtree:true,childList:true});
  }
  bind();
})();
</script>

<script>
(function(){
  const PINBALL_URL='https://lazygyu.github.io/roulette/';

  function esc368(s){
    return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function root368(){return document.getElementById('extraPage');}
  function setRoot368(s){const r=root368();if(r)r.innerHTML=s;}

  window.renderMiniGamesV368=function(){
    setRoot368(`<div class="card data-page v368-games">
      <div class="head"><div><div class="title">🎮 미니 게임</div><div class="v368-sub">직접 이름을 입력해서 바로 게임을 즐길 수 있습니다.</div></div></div>
      <div class="v368-game-grid">

          <span class="ico">🎱</span><b>핀볼</b><small>외부 핀볼 게임으로 바로 이동합니다.</small>
        </a>
        <button class="v368-game-card" onclick="renderV368RaceSetup()"><span class="ico">🏎️</span><b>경주</b><small>최대 6명이 참가하며 총 10초 동안 실제로 추월하고 뒤처집니다.</small></button>
        <button class="v368-game-card" onclick="renderV368LadderSetup()"><span class="ico">🪜</span><b>사다리타기</b><small>참가자와 결과를 직접 입력하고, 한 명씩 결과를 확인할 수 있습니다.</small></button>
        <button class="v368-game-card" onclick="renderV368Simulation()"><span class="ico">🎰</span><b>시뮬레이션</b><small>강화·뽑기·주사위 시뮬레이션을 사용합니다.</small></button>
      </div>
    </div>`);
  };

  function namesInputs(prefix,count,max){
    return Array.from({length:count},(_,i)=>`<div class="v368-input-row"><span style="width:26px;text-align:center">${i+1}</span><input id="${prefix}${i}" maxlength="12" placeholder="참가자 ${i+1}"></div>`).join('');
  }

  window.renderV368RaceSetup=function(){
    setRoot368(`<div class="card data-page v368-panel">
      <div class="v368-head"><div><div class="title">🏎️ 10초 레이스</div><div class="v368-sub">이름을 직접 입력하세요. 최대 6명입니다.</div></div><button class="ghost" onclick="renderMiniGamesV368()">← 미니 게임</button></div>
      <div class="v368-input-grid">${namesInputs('v368r',6)}</div>
      <div class="v368-tools"><button class="primary" onclick="startV368Race()">🏁 레이스 시작</button><button class="ghost" onclick="fillV368RaceSample()">예시 입력</button></div>
      <div class="v368-sub">레이스는 정확히 10초 동안 진행되며, 중간에 순위가 계속 뒤바뀌도록 움직입니다.</div>
    </div>`);
  };
  window.fillV368RaceSample=function(){
    ['베키','뚠뚠','리츠','환타','큐르','꾸블'].forEach((n,i)=>{const e=document.getElementById('v368r'+i);if(e)e.value=n;});
  };

  window.startV368Race=function(){
    const names=Array.from({length:6},(_,i)=>document.getElementById('v368r'+i)?.value.trim()).filter(Boolean);
    if(names.length<2){alert('2명 이상 입력해주세요.');return;}
    if(new Set(names).size!==names.length){alert('같은 이름은 사용할 수 없습니다.');return;}
    const lanes=names.map((n,i)=>({n,i,skill:.88+Math.random()*.24,phase:Math.random()*6.28,noise:Math.random()*5}));
    lanes.forEach(x=>x.finish=0.88+Math.random()*.12);
    setRoot368(`<div class="card data-page v368-panel">
      <div class="v368-head"><div><div class="title">🏎️ 10초 레이스</div><div class="v368-sub">순위가 계속 바뀝니다. 마지막 순간까지 결과를 알 수 없습니다.</div></div></div>
      <div class="v368-race-wrap"><canvas id="v368RaceCanvas" width="1100" height="430"></canvas><div id="v368RaceStatus" class="v368-race-status">READY</div></div>
    </div>`);
    runV368Race(lanes);
  };

  function runV368Race(lanes){
    const c=document.getElementById('v368RaceCanvas'),ctx=c.getContext('2d'),status=document.getElementById('v368RaceStatus');
    const start=performance.now(), duration=10000;
    const colors=['#5aa9ff','#c084fc','#f59e72','#65d6a0','#f4d35e','#ef7aa8'];
    function frame(now){
      const t=Math.min(1,(now-start)/duration),sec=t*10;
      ctx.clearRect(0,0,c.width,c.height);
      ctx.fillStyle='#070c14';ctx.fillRect(0,0,c.width,c.height);
      const left=190,right=1035,top=48,gap=58;
      ctx.font='700 15px sans-serif';
      lanes.forEach((p,i)=>{
        const y=top+i*gap;
        ctx.strokeStyle='#26344a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
        ctx.fillStyle='#dce5f4';ctx.fillText(p.n,20,y+5);
        ctx.strokeStyle='#34445e';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(right,y-24);ctx.lineTo(right,y+24);ctx.stroke();ctx.setLineDash([]);
      });
      // Deterministic-but-chaotic movement. Base progress differs per player,
      // while multiple sine waves create overtakes throughout the 10 seconds.
      const pos=lanes.map((p,i)=>{
        const wave=0.075*Math.sin(sec*1.75+p.phase)+0.045*Math.sin(sec*3.4+p.phase*1.7)+0.025*Math.sin(sec*6.1+p.noise);
        const momentum=(p.skill-.99)*0.42;
        let v=Math.max(0,Math.min(1, t + wave*(0.7+0.3*t) + momentum*t));
        if(t===1)v=p.finish;
        return {...p,v};
      });
      pos.sort((a,b)=>b.v-a.v);
      pos.forEach((p,rank)=>{
        const original=lanes.findIndex(x=>x.i===p.i), y=top+original*gap;
        const x=left+(right-left)*p.v;
        ctx.font='26px sans-serif';ctx.fillText('🏎️',x-13,y-15);
        ctx.fillStyle=colors[p.i%colors.length];ctx.beginPath();ctx.arc(x+2,y+10,5,0,Math.PI*2);ctx.fill();
      });
      status.textContent=t<1?`🏁 진행 중  ${sec.toFixed(1)} / 10.0초`:'🏆 결승선 도착!';
      if(t<1){requestAnimationFrame(frame);return;}
      showV368RaceResult(pos);
    }
    requestAnimationFrame(frame);
  }
  function showV368RaceResult(sorted){
    const c=document.getElementById('v368RaceCanvas'); if(!c)return;
    const parent=c.parentElement;
    const rows=sorted.map((p,i)=>`<div class="v368-result-row"><b>${i+1}위</b><span>🏎️ ${esc368(p.n)}</span><strong>${(9.25+p.i*.11+Math.random()*.18).toFixed(2)}초</strong></div>`).join('');
    parent.insertAdjacentHTML('afterend',`<div class="v368-results"><b>🏁 최종 결과</b>${rows}</div>`);
  }

  window.renderV368LadderSetup=function(){
    setRoot368(`<div class="card data-page v368-panel">
      <div class="v368-head"><div><div class="title">🪜 사다리타기</div><div class="v368-sub">네이버 사다리처럼 참가자와 결과를 직접 입력합니다.</div></div><button class="ghost" onclick="renderMiniGamesV368()">← 미니 게임</button></div>
      <div class="v368-ladder-config">
        <div><h3>참가자</h3><div id="v368Names" class="v368-input-grid" style="grid-template-columns:1fr">${namesInputs('v368n',12)}</div></div>
        <div><h3>결과</h3><div id="v368Outs" class="v368-input-grid" style="grid-template-columns:1fr">${namesInputs('v368o',12).replaceAll('placeholder="참가자','placeholder="결과')}</div></div>
      </div>

  };

  function makeLadder368(n){
    const levels=10, steps=[];
    for(let r=0;r<levels;r++){
      const row=[];
      for(let i=0;i<n-1;i++)row.push(false);
      let last=-2;
      const shuffled=Array.from({length:n-1},(_,i)=>i).sort(()=>Math.random()-.5);
      shuffled.forEach(i=>{if(i!==last+1 && Math.random()<.55){row[i]=true;last=i;}});
      steps.push(row);
    }
    return steps;
  }
  function traceLadder368(start,steps){
    let x=start;
    for(let r=0;r<steps.length;r++){
      if(x>0 && steps[r][x-1])x--;
      else if(x<steps[r].length && steps[r][x])x++;
    }
    return x;

    outs.forEach((o,i)=>svg+=`<rect x="${xs[i]-50}" y="365" width="100" height="36" rx="9" fill="#111b2b" stroke="#34445e"/><text x="${xs[i]}" y="389" fill="#e7edf8" text-anchor="middle" font-size="13">${esc368(o)}</text>`);

  }
  function revealOneV368(idx){

<script>
(function(){

  window.renderV369LadderSetup=function(){
    const r=document.getElementById('extraPage');if(!r)return;
    r.innerHTML=`<div class="card data-page v368-panel">
      <div class="v368-head"><div><div class="title">🪜 사다리타기</div><div class="v368-sub">참가자와 결과를 가로로 입력하고, 네이버 사다리처럼 선을 따라 이동합니다.</div></div><button class="ghost" type="button" id="v369Back">← 게임 선택</button></div>
      <h3 style="margin:8px 0">참가자</h3>${inputs('v369n','참가자',12)}
      <h3 style="margin:14px 0 8px">결과</h3>${inputs('v369o','결과',12)}
      <div class="v368-tools"><button class="primary" type="button" id="v369Start">🪜 사다리 시작</button><button class="ghost" type="button" id="v369Sample">예시 입력</button></div>
      <div class="v368-sub">2~12명까지 가능합니다. 빈 칸은 제외되며 참가자 수와 결과 수가 같아야 합니다.</div>
    </div>`;
    document.getElementById('v369Back').onclick=()=>window.renderMiniGamesV368();
    document.getElementById('v369Sample').onclick=()=>{
      ['베키','뚠뚠','리츠','환타','큐르','꾸블'].forEach((n,i)=>document.getElementById('v369n'+i).value=n);
      ['1등','2등','꽝','간식','면제','다시'].forEach((n,i)=>document.getElementById('v369o'+i).value=n);
    };
    document.getElementById('v369Start').onclick=start;
  };

  function makeSteps(n){
    const rows=[];
    for(let r=0;r<12;r++){
      const row=Array(n-1).fill(false);
      for(let i=0;i<n-1;i++){
        if(i>0&&row[i-1])continue;
        if(Math.random()<0.42)row[i]=true;
      }
      rows.push(row);
    }
    return rows;
  }
  function trace(start,steps){
    let x=start;
    for(const row of steps){
      if(x>0&&row[x-1])x--;
      else if(x<row.length&&row[x])x++;
    }
    return x;
  }
  function start(){
    const names=Array.from({length:12},(_,i)=>document.getElementById('v369n'+i)?.value.trim()).filter(Boolean);
    const outs=Array.from({length:12},(_,i)=>document.getElementById('v369o'+i)?.value.trim()).filter(Boolean);
    if(names.length<2){alert('참가자를 2명 이상 입력해주세요.');return}
    if(names.length!==outs.length){alert('참가자 수와 결과 수를 같게 입력해주세요.');return}
    if(new Set(names).size!==names.length){alert('같은 참가자 이름은 사용할 수 없습니다.');return}
    const steps=makeSteps(names.length);
    const ends=names.map((_,i)=>trace(i,steps));
    const state={names,outs,steps,ends};
    window.__v369=state;
    drawBoard(state);
  }

  function drawBoard(st){
    const n=st.names.length,W=1000,H=520,L=80,R=920,TOP=85,BOT=430;
    const xs=Array.from({length:n},(_,i)=>L+(R-L)*(i/(n-1)));
    let svg=`<svg id="v369Svg" class="v369-svg" viewBox="0 0 ${W} ${H}" aria-label="사다리">`;
    svg+=`<defs><filter id="v369Glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    xs.forEach((x,i)=>svg+=`<line x1="${x}" y1="${TOP}" x2="${x}" y2="${BOT}" stroke="#596981" stroke-width="4"/>`);
    st.steps.forEach((row,ri)=>row.forEach((on,i)=>{
      if(on){const y=TOP+(BOT-TOP)*(ri+1)/(st.steps.length+1);svg+=`<line x1="${xs[i]}" y1="${y}" x2="${xs[i+1]}" y2="${y}" stroke="#596981" stroke-width="4"/>`;}
    }));
    svg+=`</svg>`;
    const startChips=st.names.map((n,i)=>`<div class="v369-chip">${esc(n)}</div>`).join('');
    const endChips=st.outs.map((o,i)=>`<div class="v369-chip">${esc(o)}</div>`).join('');
    const r=document.getElementById('extraPage');
    r.innerHTML=`<div class="card data-page v368-panel">
      <div class="v368-head"><div><div class="title">🪜 사다리타기</div><div class="v368-sub">참가자를 클릭하면 주황색 선이 사다리를 따라 내려가 결과까지 이동합니다.</div></div><div class="v368-tools" style="margin:0"><button class="ghost" id="v369Again">↻ 다시하기</button><button class="ghost" id="v369Home">← 게임 선택</button></div></div>
      <div class="v369-start-row">${startChips}</div>
      <div class="v369-board">${svg}</div>
      <div class="v369-end-row">${endChips}</div>
      <div class="v368-tools"><button class="primary" id="v369All">전체 결과 보기</button></div>
      <div id="v369Results" class="v368-results" aria-live="polite"><b>결과</b><div class="v368-sub">위의 참가자 이름을 클릭하세요.</div></div>
    </div>`;
    document.getElementById('v369Again').onclick=()=>window.renderV369LadderSetup();
    document.getElementById('v369Home').onclick=()=>window.renderMiniGamesV368();
    document.getElementById('v369All').onclick=()=>{st.names.forEach((_,i)=>reveal(i));};
    document.querySelectorAll('.v369-start-row .v369-chip').forEach((el,i)=>el.onclick=()=>reveal(i));
  }

  function reveal(idx){
    const st=window.__v369;if(!st)return;
    const svg=document.getElementById('v369Svg');if(!svg)return;
    svg.querySelectorAll('.v369-trace,.v369-ball').forEach(e=>e.remove());
    const n=st.names.length,W=1000,H=520,L=80,R=920,TOP=85,BOT=430;
    const xs=Array.from({length:n},(_,i)=>L+(R-L)*(i/(n-1)));
    let x=idx,pts=[[xs[x],TOP]];
    for(let ri=0;ri<st.steps.length;ri++){
      const y=TOP+(BOT-TOP)*(ri+1)/(st.steps.length+1);
      if(x>0&&st.steps[ri][x-1]){pts.push([xs[x],y],[xs[x-1],y]);x--;}
      else if(x<st.steps[ri].length&&st.steps[ri][x]){pts.push([xs[x],y],[xs[x+1],y]);x++;}
      else pts.push([xs[x],y]);
    }
    pts.push([xs[x],BOT]);
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('class','v369-trace');poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));
    svg.appendChild(poly);
    const ball=document.createElementNS('http://www.w3.org/2000/svg','circle');ball.setAttribute('class','v369-ball');ball.setAttribute('r','9');svg.appendChild(ball);
    const total=pts.length-1,dur=2200,start=performance.now();
    function animate(now){
      const p=Math.min(1,(now-start)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      const q=e*total,k=Math.floor(q),f=q-k,a=pts[Math.min(k,total)],b=pts[Math.min(k+1,total)];
      ball.setAttribute('cx',a[0]+(b[0]-a[0])*f);ball.setAttribute('cy',a[1]+(b[1]-a[1])*f);
      if(p<1)requestAnimationFrame(animate);else{
        const res=document.getElementById('v369Results');
        const existing=res.querySelector('.v369-current');
        if(existing)existing.remove();
        res.insertAdjacentHTML('beforeend',`<div class="v369-current v369-result-row"><b>${esc(st.names[idx])}</b><span>→</span><strong>${esc(st.outs[x])}</strong></div>`);
      }
    }
    requestAnimationFrame(animate);
  }
})();
</script>

(function(){
  const LOGIN_KEY_V3611='ddunteam.login';

  function getSavedNick(){
    try{
      const v=JSON.parse(localStorage.getItem(LOGIN_KEY_V3611)||'null');

    window.__v3611CloudRefreshWrapped=true;

      const result=await baseCloudRefresh.apply(this,arguments);

        currentNick=savedNick;

        try{renderCurrent();}catch(e){}
      }

    };
  }

  /* 보안상 '베키라는 문자열'만으로 페이지 소유자가 되지 않도록 수정 */
  window.isPageOwner=function(){

    return !!(cloudUser && cloudOwnerId && cloudUser.id===cloudOwnerId);
  };

  window.openBulkWeaponPicker=function(btn){
    bulkDraft=captureBulkDraft();
    window.bulkWeaponIndex=[...document.querySelectorAll('#bulkRows .bulk-row')].indexOf(btn.closest('.bulk-row'));
    const current=btn.dataset.weapon || btn.textContent.trim() || '모름';
    openModal(`<div class="modal-head"><h3>웨폰 선택</h3><button class="close" onclick="restoreBulkMemberModal()">×</button></div><div class="weapon-grid">${weaponNames.map(w=>`<button type="button" class="weapon-choice ${w===current?'active':''}" onclick="selectBulkWeapon('${escapeHtml(w)}')">${escapeHtml(w)}</button>`).join('')}</div>`);
  };
  window.restoreBulkMemberModal=function(){
    const draft=bulkDraft ? bulkDraft.map(x=>({...x})) : [{nickname:'',level:'90',weapon:'모름',role:'일반'}];
    const idx=Number.isInteger(window.bulkWeaponIndex)?window.bulkWeaponIndex:-1;
    if(idx>=0 && draft[idx] && !draft[idx].weapon) draft[idx].weapon='모름';
    const modalEl=document.getElementById('modal');
    if(!modalEl) return;
    modalEl.className='modal wide';
    modalEl.innerHTML=`<div class="modal-head"><div><h3>혈맹원 다중 추가</h3><div class="admin-sub">여러 명을 한 번에 등록할 수 있습니다.</div></div><button class="close" onclick="closeModal()">×</button></div>
      <div class="bulk-head"><span>닉네임</span><span>레벨</span><span>웨폰</span><span>등급</span><span></span></div>
      <div id="bulkRows" class="bulk-table">${draft.map(makeBulkRow).join('')}</div>
      <div class="bulk-add-row"><button id="bulkAddRowBtn" type="button">＋ 행 추가</button><span class="readonly-note">닉네임 중복은 저장 전에 검사합니다.</span></div>
      <div class="modal-actions"><button onclick="closeModal()">취소</button><button class="primary" onclick="saveBulkMembers()">한 번에 저장</button></div>`;
    bindBulkAddButton();
    bulkDraft=null;
    window.bulkWeaponIndex=null;
  };
  window.selectBulkWeapon=function(w){
    const idx=Number.isInteger(window.bulkWeaponIndex)?window.bulkWeaponIndex:-1;
    const draft=bulkDraft ? bulkDraft.map(x=>({...x})) : captureBulkDraft();
    if(idx>=0 && draft[idx]) draft[idx].weapon=w;
    bulkDraft=draft;
    restoreBulkMemberModal();
  };
  window.saveBulkMembers=async function(){
    if(!canClanManage()) return toast('혈맹원 관리는 페이지 소유자/군주만 가능합니다.');
    const rows=[...document.querySelectorAll('#bulkRows .bulk-row')], payloads=[], names=new Set(members.map(m=>m[0]));
    for(const row of rows){
      const n=row.querySelector('.bulk-nick').value.trim();
      if(!n) continue;
      if(names.has(n)||payloads.some(x=>x.nickname===n)) return toast('중복 닉네임이 있습니다: '+n);
      if(n==='베키') return toast('베키는 다중 추가로 등록할 수 없습니다.');
      payloads.push({clan_id:CLOUD_CLAN_ID,nickname:n,level:+row.querySelector('.bulk-level').value||0,weapon:row.querySelector('.bulk-weapon').dataset.weapon||row.querySelector('.bulk-weapon').textContent.trim()||'모름',role:row.querySelector('.bulk-role').value});
    }
    if(!payloads.length) return toast('추가할 혈맹원을 입력해주세요.');
    const {error}=await cloudClient.from('clan_members').insert(payloads);
    if(error) return cloudErr(error);
    await cloudLoad();
    renderAll();
    closeModal();
    toast(payloads.length+'명의 혈맹원을 추가했습니다.');
  };
})();
</script>

<!-- v36.36: reliable member ordering using persisted rank store -->
<script>
(function(){
  function getPersistedRanks(){
    try{return JSON.parse(localStorage.getItem('ddunteam.memberRanks.v35')||'{}')||{};}catch(e){return {};}
  }
  window.renderMembers=function(){
    const q=(document.getElementById('memberSearch')?.value||'').trim().toLowerCase();
    const el=document.getElementById('members');
    if(!el||!Array.isArray(members))return;
    const ranks=getPersistedRanks();
    const rankOrder={'페이지 소유자':0,'군주':1,'관리자':2,'수호':3,'일반':4};
    const rows=members.map((m,i)=>{
      const role=String(m[0]||'')==='베키'?'페이지 소유자':String(m[3]||'일반');
      const raw=ranks[String(m[0]||'')];
      const rankVal=(raw!==undefined&&raw!==null&&String(raw).trim()!=='')?Number(raw):null;
      return {m,i,role,roleOrder:rankOrder[role]??4,level:Number(m[1])||0,rankVal};
    }).filter(x=>String(x.m[0]||'').toLowerCase().includes(q));
    rows.sort((a,b)=>{
      if(a.roleOrder!==b.roleOrder)return a.roleOrder-b.roleOrder;
      if(a.level!==b.level)return b.level-a.level;
      if(a.rankVal!==null&&b.rankVal!==null&&a.rankVal!==b.rankVal)return a.rankVal-b.rankVal;
      if(a.rankVal!==null&&b.rankVal===null)return -1;
      if(a.rankVal===null&&b.rankVal!==null)return 1;
      return String(a.m[0]||'').localeCompare(String(b.m[0]||''),'ko');
    });
    el.innerHTML='';
    rows.forEach(x=>{
      const m=x.m,i=x.i,selected=selectedMember===i;
      const d=document.createElement('div');
      d.className='member'+(selected?' active selected':'');
      d.dataset.memberIndex=String(i);
      d.onclick=e=>{if(e.target.closest('button'))return;e.preventDefault();e.stopPropagation();toggleMemberSelection(i)};
      const cls=x.role==='페이지 소유자'?'rank-owner':x.role==='군주'?'rank-lord':x.role==='관리자'?'rank-admin':x.role==='수호'?'rank-guard':'rank-normal';
      const canEdit=typeof canClanManage==='function'&&canClanManage();
      const actions=canEdit?'<button class="mini" onclick="event.stopPropagation();openMemberModal('+i+')">수정</button><button class="mini" title="운영진 특이사항 보기" onclick="event.stopPropagation();openMemberNoteViewer('+i+')">🔍</button>':'';
      const removeBtn=selected&&canEdit&&m[0]!=='베키'?'<button class="mini danger member-remove" title="혈맹원 제거" onclick="event.stopPropagation();removeSelected('+i+')">×</button>':'';
      d.innerHTML='<div class="avatar">'+escapeHtml(String(m[0]||'')[0]||'?')+'</div><div class="mtext"><div class="mname">'+escapeHtml(m[0])+' <span class="rank '+cls+'">'+escapeHtml(x.role)+'</span></div><div class="sub">Lv.'+(m[1]??'')+' · '+escapeHtml(m[2]||'모름')+'</div></div><div class="member-actions">'+actions+removeBtn+'</div>';
      el.appendChild(d);
    });
    const count=document.getElementById('memberCount');if(count)count.textContent=members.length+'명';
  };
})();
</script>
